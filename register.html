<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAFFLE TIME - Seller Registration</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <div class="logo">
    <img src="assets/logo.png" alt="Waffle Ticket Time Logo">
    <div>
        <h1>WAFFLE TICKET TIME</h1>
        <p>Create Seller Account</p>
    </div>
</div>
    <p>Create Seller Account</p>
</header>

<main class="hero">

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required>

        <br><br>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>

        <br><br>

        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
            required>

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <br><br>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required>

        <br><br>

        <button type="submit">
            Create Seller Account
        </button>

    </form>

</main>

<script type="module" src="js/register.js"></script>

</body>
</html>
