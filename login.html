<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waffle Ticket Time - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="assets/logo.png" alt="Waffle Ticket Time Logo">

        <div>
            <h1>WAFFLE TICKET TIME</h1>
            <p>Seller Login</p>
        </div>
    </div>

</header>

<main>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

</main>

<script type="module" src="js/login.js"></script>

</body>
</html>
